# Runs the API with gunicorn against a local Postgres, mirroring production.
services:
  api:
    build: .
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://advisor:advisor@db:5432/advisor
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: advisor
      POSTGRES_PASSWORD: advisor
      POSTGRES_DB: advisor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U advisor"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
